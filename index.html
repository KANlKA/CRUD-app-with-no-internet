<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Offline Task Manager — CRUD Demo</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: monospace;
    padding: 30px;
    max-width: 560px;
  }
  .sub {
    font-size: 12px;
    color: #666;
    margin: 0 0 20px;
  }
  form {
    display: flex;
    gap: 6px;
    margin-bottom: 16px;
  }
  input[type=text] { flex: 1; font-family: monospace; font-size: 14px; padding: 4px; }
  button { font-family: monospace; font-size: 14px; cursor: pointer; }

  ul { list-style: none; padding: 0; margin: 0; }
  li {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px 0;
    border-bottom: 1px solid #ddd;
  }
  li .title { flex: 1; }
  li.done .title { text-decoration: line-through; color: #999; }
  .edit-input { flex: 1; font-family: monospace; font-size: 14px; }

  .empty { color: #999; font-size: 13px; padding: 10px 0; }
  .stats {
    margin-top: 12px;
    font-size: 12px;
    color: #666;
    display: flex;
    justify-content: space-between;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Task Manager</h1>
  <p class="sub">Pure CRUD, zero network calls. Data lives in a JS array in memory — refreshing the page resets it. <code>fetch</code> is never called.</p>

  <form id="add-form">
    <input type="text" id="add-input" placeholder="Add a task…" autocomplete="off" />
    <button type="submit" class="btn-add">Add</button>
  </form>

  <ul id="list"></ul>
  <div class="stats">
    <span id="count-label">0 tasks</span>
    <button id="clear-done">Clear completed</button>
  </div>
</div>

<script>
  // ---- "Database": just an in-memory array. No localStorage, no server, no internet. ----
  let tasks = [
    { id: 1, title: "Review Big-O for sorting algorithms", done: false },
    { id: 2, title: "Practice OOP design questions", done: true },
  ];
  let nextId = 3;

  const list = document.getElementById('list');
  const countLabel = document.getElementById('count-label');
  const form = document.getElementById('add-form');
  const input = document.getElementById('add-input');

  // ----- CREATE -----
  function createTask(title) {
    tasks.push({ id: nextId++, title, done: false });
    render();
  }

  // ----- READ ----- (render() reads from `tasks` and draws the UI)
  function render() {
    list.innerHTML = '';

    if (tasks.length === 0) {
      list.innerHTML = '<div class="empty">No tasks yet. Add one above.</div>';
    }

    tasks.forEach(task => {
      const li = document.createElement('li');
      li.className = task.done ? 'done' : '';
      li.dataset.id = task.id;

      if (task.editing) {
        li.innerHTML = `
          <input type="checkbox" ${task.done ? 'checked' : ''} disabled />
          <input type="text" class="edit-input" value="${escapeHtml(task.title)}" />
          <button class="icon-btn save">Save</button>
          <button class="icon-btn cancel">Cancel</button>
        `;
        const editInput = li.querySelector('.edit-input');
        editInput.focus();
        editInput.select();

        li.querySelector('.save').onclick = () => updateTask(task.id, editInput.value);
        editInput.addEventListener('keydown', e => {
          if (e.key === 'Enter') updateTask(task.id, editInput.value);
          if (e.key === 'Escape') { task.editing = false; render(); }
        });
        li.querySelector('.cancel').onclick = () => { task.editing = false; render(); };
      } else {
        li.innerHTML = `
          <input type="checkbox" ${task.done ? 'checked' : ''} />
          <span class="title">${escapeHtml(task.title)}</span>
          <button class="icon-btn edit">Edit</button>
          <button class="icon-btn delete">Delete</button>
        `;
        li.querySelector('input[type=checkbox]').onchange = () => toggleDone(task.id);
        li.querySelector('.edit').onclick = () => { task.editing = true; render(); };
        li.querySelector('.delete').onclick = () => deleteTask(task.id);
      }

      list.appendChild(li);
    });

    const remaining = tasks.filter(t => !t.done).length;
    countLabel.textContent = `${tasks.length} task${tasks.length !== 1 ? 's' : ''} · ${remaining} remaining`;
  }

  // ----- UPDATE -----
  function updateTask(id, newTitle) {
    const task = tasks.find(t => t.id === id);
    if (!task) return;
    const trimmed = newTitle.trim();
    if (trimmed) task.title = trimmed;
    task.editing = false;
    render();
  }

  function toggleDone(id) {
    const task = tasks.find(t => t.id === id);
    if (task) task.done = !task.done;
    render();
  }

  // ----- DELETE -----
  function deleteTask(id) {
    tasks = tasks.filter(t => t.id !== id);
    render();
  }

  document.getElementById('clear-done').onclick = () => {
    tasks = tasks.filter(t => !t.done);
    render();
  };

  // ----- form wiring -----
  form.addEventListener('submit', e => {
    e.preventDefault();
    const val = input.value.trim();
    if (!val) return;
    createTask(val);
    input.value = '';
    input.focus();
  });

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  render();
</script>
</body>
</html>
